name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK (stable upload keystore)
        run: ./gradlew assembleDebug --stacktrace

      - name: Print signing certificate SHA-256
        run: |
          echo "=== Upload keystore certificate fingerprint ==="
          keytool -list -v \
            -keystore keystore/health-bank-upload.jks \
            -storepass healthbank2026 \
            -alias healthbank 2>/dev/null | grep -E "Alias name|SHA256:|Valid from"
          echo "keystore: keystore/health-bank-upload.jks"
          echo "alias: healthbank"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/health-bank.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-bank-apk
          path: dist/health-bank.apk
          if-no-files-found: error
